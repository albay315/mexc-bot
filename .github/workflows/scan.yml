name: MEXC HalfTrend Scan

on:
  schedule:
    # Her 15 dakikada bir çalışır (GitHub Actions cron UTC zamanına göredir).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # Actions sekmesinden elle "Run workflow" ile de tetiklenebilir

permissions:
  contents: write   # state.json değişikliğini repoya commit'leyebilmek için gerekli

concurrency:
  group: mexc-halftrend-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mexc_halftrend_bot.py

      - name: Güncellenen state.json dosyasını commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git commit -m "state güncellendi [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Çakışma oldu, tekrar deneniyor... ($i)"
            sleep $((RANDOM % 5 + 2))
          done
